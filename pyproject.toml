[project]
name = "glasshome"
version = "0.1.0"
description = "Control Home Assistant devices from Qwen AI glasses: MCP tools for the platform model, plus the older Agent protocol endpoint"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13.1",
]

[project.scripts]
glasshome = "glasshome.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasshome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
