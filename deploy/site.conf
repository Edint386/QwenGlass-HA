# 加进你自己 HTTPS 站点（nginx）的 server 块里。平台的 MCP 插件调 https://你的域名/home/mcp：
# 「无状态协议」每次调用一个 POST，服务自己校验 Bearer Token。
# 不要开 HTTP/3，也不要发 Alt-Svc: h3：平台的执行端见到会改走 QUIC，UDP 不通就超时。

location = /home/mcp {
    proxy_pass http://127.0.0.1:19531/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}

# 检查用：返回 {"ok":true,"ha":true} 就是服务起来了、也连上了 HA
location = /home/healthz {
    proxy_pass http://127.0.0.1:19531/healthz;
}
